<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roselyn Chen | Article</title>
  <meta
    name="description"
    content="A publication-style article layout generated from markdown."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../../styles.css">
  
</head>
<body>
  <div class="page page-article-ref">
    <header class="tm-header">
      <div class="tm-header-left">
        <a class="tm-wordmark" href="../../">Roselyn Chen</a>
      </div>
      <nav class="tm-top-nav" aria-label="Primary">
        <a href="../../">Home</a>
        <a href="../../about/">About</a>
        <a href="../" aria-current="page">Archive</a>
      </nav>
    </header>

    <main class="tm-main">
      <aside class="tm-toc" aria-label="On this page">
        <a class="tm-toc-h2" href="#hello-world">Hello World</a>
      </aside>

      <article class="tm-content">
        <header class="tm-hero tm-hero-centered">
          <p class="tm-kicker">Archive</p>
          <h1 class="tm-title-highlight">Hello World!!</h1>
          <div class="tm-publish-metadata">
            <span>Roselyn Chen</span>
            <span>May 17, 2026</span>
          </div>
        </header>

        <section class="tm-article-body">
          <details open data-section="hello-world" class="section-h2"><summary><h2 id="hello-world">Hello World</h2></summary><div class="section-inner"><div class="section-content">
          <p>马上开始 robot learning 学习, 希望能记录一些有用的blog.</p></div></div></details>
        </section>
      </article>
    </main>
  </div>
  <script>
  (function() {
    var toc = document.querySelector('.tm-toc');
    var body = document.querySelector('.tm-article-body');
    if (!toc || !body) return;
    var animating = new Set();
    var DURATION = 250;

    function animateToggle(el, open) {
      var inner = el.querySelector('.section-inner');
      if (!inner) { el.open = open; return; }
      if (open) {
        el.open = true;
        el.classList.remove('closing');
        el.classList.add('opening');
        inner.style.gridTemplateRows = '1fr';
        var heading = el.querySelector('summary > *');
        if (heading) heading.scrollIntoView({ block: 'start', behavior: 'smooth' });
        setTimeout(function() { el.classList.remove('opening'); inner.style.gridTemplateRows = ''; }, DURATION);
      } else {
        animating.add(el);
        el.classList.add('closing');
        requestAnimationFrame(function() {
          inner.style.gridTemplateRows = '0fr';
          setTimeout(function() {
            el.open = false;
            el.classList.remove('closing');
            inner.style.gridTemplateRows = '';
            animating.delete(el);
          }, DURATION);
        });
      }
    }

    function sync(from, to, animate) {
      var id = from.getAttribute('data-section');
      if (!id) return;
      var target = to.querySelector('[data-section="' + id + '"]');
      if (!target || target.open === from.open || animating.has(target)) return;
      if (animate) animateToggle(target, from.open);
      else target.open = from.open;
    }

    body.addEventListener('toggle', function(e) {
      if (animating.has(e.target)) return;
      sync(e.target, toc, false);
    }, true);

    toc.addEventListener('toggle', function(e) {
      sync(e.target, body, true);
    }, true);
  })();
  </script>
</body>
</html>
